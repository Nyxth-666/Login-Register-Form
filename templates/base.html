{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Fate{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body class="bg-cream font-sans text-ink">
  <div class="grid min-h-screen lg:grid-cols-2">
    <aside class="sticky top-0 hidden h-screen p-4 lg:block">
      <img src="{% static 'images/auth-bg.png' %}" alt="" class="h-full w-full rounded-2xl object-cover">
    </aside>

    <main class="flex items-center justify-center px-6 py-10">
      <div class="w-full max-w-md">
        {% for message in messages %}
          <div class="mb-4 rounded-lg bg-green-100 px-4 py-2 text-sm text-green-800">{{ message }}</div>
        {% endfor %}
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>

  <script>
    document.querySelectorAll('[data-toggle-password]').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = btn.parentElement.querySelector('input');
        input.type = input.type === 'password' ? 'text' : 'password';
      });
    });
  </script>
</body>
</html>
