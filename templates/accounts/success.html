{% extends 'base.html' %}
{% block title %}Success{% endblock %}
{% block content %}
<div class="text-center">
  <div class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-full bg-navy text-3xl text-white">✓</div>
  <h1 class="font-serif text-3xl font-bold">Login successful</h1>
  <p class="mt-2 text-sm text-muted">Welcome back, <span class="font-medium text-ink">{{ user.first_name|default:user.email }}</span>.</p>
  <form method="post" action="{% url 'logout' %}" class="mt-6">
    {% csrf_token %}
    <button type="submit" class="rounded-lg border border-line bg-white/60 px-6 py-2.5 text-sm hover:bg-white transition">Log out</button>
  </form>
</div>
{% endblock %}
