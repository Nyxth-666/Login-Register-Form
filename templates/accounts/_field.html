<div>
  <div class="relative">
    {{ field }}
    {% if password %}
    <button type="button" data-toggle-password aria-label="Show or hide password"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-muted hover:text-ink">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </button>
    {% endif %}
  </div>
  {% for error in field.errors %}<p class="mt-1 text-xs text-red-600">{{ error }}</p>{% endfor %}
</div>
